{{ define "content" }}
<div class="archive">
    <h2 class="post-title">{{ .Title }}</h2>
    <div class="card-grid projects-grid">
        {{ range (where site.RegularPages "Type" "projects").ByWeight }}
        <a class="card" href="{{ .RelPermalink }}">
            <h3>{{ .Title }}</h3>
            <p>{{ .Params.summary }}</p>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
