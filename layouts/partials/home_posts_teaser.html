{{ $posts := where site.RegularPages "Section" "posts" }}
{{ $posts = $posts.ByDate.Reverse }}
{{ if $posts }}
<section class="home-section home-section--wide">
  <div class="home-section-header">
    <h2>Latest posts</h2>
    <a class="home-section-link" href="/posts/">All posts &rarr;</a>
  </div>
  <div class="card-grid">
    {{ range first 3 $posts }}
    <a class="card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      <p>{{ .Date.Format "2 January 2006" }}</p>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
