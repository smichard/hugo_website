{{ $certs := site.Data.certifications }}
{{ if $certs }}
<section class="home-section">
  <div class="home-section-header">
    <h2>Certifications</h2>
    <a class="home-section-link" href="/about/#certifications">All {{ len $certs }} &rarr;</a>
  </div>
  <div class="certifications-strip">
    {{ range first 6 $certs }}
    <span class="tag">{{ .name }}</span>
    {{ end }}
  </div>
</section>
{{ end }}
