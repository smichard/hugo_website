{{ if .Params.toc.enable }}
<div class="expand" id="toc-static">
  <button class="expand__button" type="button" aria-expanded="false" aria-controls="toc-content">
    {{ "Table of Contents" }}
    <span class="expand-icon expand-icon__right">
        {{ partial "svgs/arrow-right.svg" (dict "width" 30 "height" 30) }}
    </span>
  </button>
  <div class="expand__content expand__content--toc" id="toc-content" hidden>
    {{ .TableOfContents }}
  </div>
</div>
{{ end }}
