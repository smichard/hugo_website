<section class="home-section home-section--wide">
  <div class="home-section-header">
    <h2>Photography</h2>
    <a class="home-section-link" href="/photos/">Full gallery &rarr;</a>
  </div>
  <div id="home-photo-grid" class="photo-grid photo-grid--teaser" aria-busy="true">
    <div id="home-photo-loading" class="photo-loading">Loading photos&hellip;</div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Mobile shows a 3-column grid (three rows of three); wider screens
    // keep the teaser to a single row of seven.
    var mobile = window.matchMedia("(max-width: 720px)").matches;
    window.initPhotoGallery({
      gridId: "home-photo-grid",
      loadingId: "home-photo-loading",
      max: mobile ? 9 : 7,
      linkTo: "/photos/"
    });
  });
</script>
