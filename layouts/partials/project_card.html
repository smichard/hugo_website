{{- $thumb := .Params.thumbnail -}}
{{- if not $thumb -}}
  {{- with .Resources.GetMatch "{cover,thumbnail}.*" -}}{{ $thumb = .RelPermalink }}{{- end -}}
{{- end -}}
<a class="card card--media" href="{{ .RelPermalink }}">
  <div class="card-media{{ if not $thumb }} card-media--empty{{ end }}">
    {{ with $thumb }}<img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">{{ else }}{{ partial "icons.html" "image" }}{{ end }}
  </div>
  <div class="card-body">
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.summary }}</p>
  </div>
</a>
