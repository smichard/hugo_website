<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      {{ partial "icons.html" "menu" }}
    </button>
    <nav class="site-nav" id="site-nav">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
      <a class="menu-item{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }} active{{ end }}" href="{{ .URL }}" title="{{ .Title }}">{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">
        <span class="theme-toggle-sun">{{ partial "icons.html" "sun" }}</span>
        <span class="theme-toggle-moon">{{ partial "icons.html" "moon" }}</span>
      </button>
    </nav>
  </div>
</header>
