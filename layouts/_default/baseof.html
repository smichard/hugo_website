<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  {{ partial "head.html" . }}
  <body>
    <div class="wrapper">
        <a class="skip-link" href="#main-content">Skip to main content</a>
        {{ partial "header.html" . }}

        <main class="page-content" id="main-content" tabindex="-1">
          {{ block "content" . }}{{ end }}
        </main>

      {{ partial "footer.html" . }}
     </div>
     {{ partial "scripts.html" . }}
  </body>
</html>
