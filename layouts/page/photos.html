{{ define "content" -}}
<div class="post-warp">
    <header class="post-header">
        <h2 class="post-title">{{ .Title }}</h2>
    </header>
    <div class="post-content">
        {{ with .Content }}<div class="photo-intro">{{ . }}</div>{{ end }}
        <div id="photo-grid" class="photo-grid">
            <div id="photo-loading" class="photo-loading">Loading photos&hellip;</div>
        </div>
    </div>
</div>

<div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="">
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    window.initPhotoGallery({
      gridId: "photo-grid",
      loadingId: "photo-loading",
      max: 30,
      lightboxId: "lightbox",
      lightboxImgId: "lightbox-img",
      lightboxCloseId: "lightbox-close"
    });
  });
</script>
{{- end }}
