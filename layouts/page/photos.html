{{ define "content" -}}
<div class="post-warp">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">
        {{ with .Content }}<div class="photo-intro">{{ . }}</div>{{ end }}
        <div id="photo-grid" class="photo-grid" aria-busy="true">
            <div id="photo-loading" class="photo-loading" role="status">Loading photos&hellip;</div>
        </div>
    </div>
</div>

<div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
    <img id="lightbox-img" alt="">
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    window.initPhotoGallery({
      gridId: "photo-grid",
      loadingId: "photo-loading",
      max: 30,
      lightboxId: "lightbox",
      lightboxImgId: "lightbox-img",
      lightboxCloseId: "lightbox-close"
    });
  });
</script>
{{- end }}
