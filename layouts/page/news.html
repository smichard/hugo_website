{{ define "content" -}}
<div class="post-warp">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">
        {{ with .Content }}<div class="news-intro">{{ . }}</div>{{ end }}

        <div id="feed-loading" class="feed-loading" role="status">Loading latest posts...</div>
        <div id="feed-error" class="feed-error" role="alert" hidden></div>
        <div id="feed-grid" class="feed-grid" data-feed-url="{{ .Params.feedURL }}"></div>
    </div>
</div>
{{- end }}
