# [START cloudbuild]
steps:
# This step fetches git submodulesbuilds.
- name: gcr.io/cloud-builders/git
  id: Git
  args:
  - 'submodule'
  - 'update'
  - '--init'
  - '--recursive'

# Fail before packaging or deployment if Hugo reports a production warning.
- name: hugomods/hugo:debian-0.164.0@sha256:79151e1fef4a53b7a01470370055519f643f8f2b7400f72588a5946e75c81a6d
  id: Validate build
  entrypoint: hugo
  env:
  - 'HUGO_ENV=production'
  args:
  - '--cacheDir'
  - '/tmp/hugo-cache'
  - '--destination'
  - '/workspace/.site-check'
  - '--cleanDestinationDir'
  - '--minify'
  - '--enableGitInfo'
  - '--panicOnWarning'

# Check generated SEO, accessibility, JSON-LD, and local asset references.
- name: python:3.14-alpine
  id: Validate output
  entrypoint: python3
  args:
  - 'scripts/validate_site.py'
  - '.site-check'

# This step builds the container image.
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args:
  - 'build'
  - '-t'
  - 'europe-north1-docker.pkg.dev/${PROJECT_ID}/hugo-website/website:${BUILD_ID}'
  - '.'

# This step pushes the image to Container Registry
# The PROJECT_ID and SHORT_SHA variables are automatically
# replaced by Cloud Build.
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args:
  - 'push'
  - 'europe-north1-docker.pkg.dev/${PROJECT_ID}/hugo-website/website:${BUILD_ID}'

# deploy container image to Google Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  id: Deploy
  args:
  - 'run'
  - 'deploy'
  - 'hugo-website'
  - '--image'
  - 'europe-north1-docker.pkg.dev/${PROJECT_ID}/hugo-website/website:${BUILD_ID}'
  - '--region'
  - 'europe-north1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'

#images:
#- gcr.io/${PROJECT_ID}/hugo-debug

# [END cloudbuild]
