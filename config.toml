baseURL = "https://www.stephan.michard.io/"
locale = "en-US"
defaultContentLanguage = "en"

title = "Stephan Michard"
theme = ["hugo-notice","KeepIt"]

enableEmoji = true
enableRobotsTXT = true
googleAnalytics = ""

pygmentsUseClasses = true
pygmentsCodefences = true

[pagination]
  pagerSize = 25

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[blackfriday]
  hrefTargetBlank = true
  nofollowLinks = true
  noreferrerLinks = true

[Permalinks]
 posts = "/:year/:title/"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2

  [[menu.main]]
    name = "Book"
    url = "/book/"
    weight = 3

  [[menu.main]]
    name = "Photos"
    url = "/photos/"
    weight = 4

  [[menu.main]]
    name = "News"
    url = "/news/"
    weight = 5

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6

[params]
    since = 2022
    author = "Dr. Stephan Michard"               # Author's name
    subtitle = ""       # Subtitle
    tagline = "a collection of random thoughts" # tagline
